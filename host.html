<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XTTP Host</title>
    <style>
        /* Remove margens e barras de rolagem da página principal */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f0f0f0;
        }

        /* Faz o iframe ocupar a tela cheia e remove as bordas */
        .sandbox-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <script>
        // 1. Captura o parâmetro 'l' da URL
        const urlParams = new URLSearchParams(window.location.search);
        const parametroBase64 = urlParams.get('l');

        if (parametroBase64) {
            try {
                // 2. Decodifica o Base64 com suporte a variantes de URL seguro
                const htmlDecodificado = atob(parametroBase64.replace(/-/g, '+').replace(/_/g, '/'));

                // 3. Cria o iframe dinamicamente com as restrições do Sandbox
                const iframe = document.createElement('iframe');
                iframe.className = 'sandbox-frame';
                
                /* 
                   Configuração do Sandbox:
                   - Sem valor (sandbox=""): Bloqueia absolutamente tudo (scripts, formulários, cookies).
                   - Se precisar que scripts rodem APENAS dentro do iframe, adicione 'allow-scripts'.
                   - NUNCA adicione 'allow-same-origin' se o conteúdo for de terceiros, 
                     pois isso quebraria a proteção do isolamento de cookies/localStorage.
                */
                iframe.setAttribute('sandbox', 'allow-scripts'); 
                
                // Injeta o HTML decodificado diretamente no documento do iframe
                iframe.srcdoc = htmlDecodificado;

                // Adiciona o iframe na página
                document.body.appendChild(iframe);

            } catch (e) {
                console.error("Erro na decodificação:", e);
                document.body.innerHTML = "<div style='padding: 20px; font-family: sans-serif;'>Erro ao decodificar o conteúdo.</div>";
            }
        } else {
            document.body.innerHTML = "<div style='padding: 20px; font-family: sans-serif;'>Nenhum parâmetro fornecido (?l=...).</div>";
        }
    </script>

</body>
</html>
