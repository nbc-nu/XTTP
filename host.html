<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XTTP hosts</title>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const conteudoBase64 = urlParams.get('l');

            if (conteudoBase64) {
                try {

                    const htmlDecodificado = decodeURIComponent(atob(conteudoBase64).split('').map(function(c) {
                        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                    }).join(''));


                    document.body.innerHTML = htmlDecodificado;


                    const novaUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
                    window.history.replaceState({ path: novaUrl }, '', novaUrl);
                } catch (e) {
                    console.error("Erro ao decodificar o Base64:", e);
                    document.body.innerHTML = "<p>Erro ao processar o código da URL.</p>";
                }
            }
        });
    </script>
</head>
<body>
    <p>This page has no code! please contact the creator.</p>
</body>
</html>
